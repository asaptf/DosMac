name: DosMac
options:
  bundleIdPrefix: tech.andrey.dosmac
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '0.1.0'
packages:
  DosMac:
    path: .
targets:
  DosMac-macOS:
    type: application
    platform: macOS
    sources: [Sources/DosMacApp]
    dependencies:
      - package: DosMac
        product: DosMacCore
      - package: DosMac
        product: DosMacVM
      - package: DosMac
        product: DosMacPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.andrey.dosmac
        PRODUCT_NAME: DosMac
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  DosMac-iOS:
    type: application
    platform: iOS
    sources: [Sources/DosMacApp]
    dependencies:
      - package: DosMac
        product: DosMacCore
      - package: DosMac
        product: DosMacVM
      - package: DosMac
        product: DosMacPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.andrey.dosmac
        PRODUCT_NAME: DosMac
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  DosMac-AppStore:
    type: application
    platform: macOS
    deploymentTarget: '27.0'
    info:
      path: Configuration/AppStore-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DosMacDistribution: app-store
    sources: [Sources/DosMacApp]
    dependencies:
      - package: DosMac
        product: DosMacCore
      - package: DosMac
        product: DosMacVM
      - package: DosMac
        product: DosMacPlatform
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: tech.andrey.dosmac
        PRODUCT_NAME: DosMac
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/AppStore.entitlements
        INFOPLIST_KEY_DosMacDistribution: app-store
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  DosMac-SandboxProbe:
    type: application
    platform: macOS
    deploymentTarget: '27.0'
    info:
      path: Configuration/SandboxProbe-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DosMacDistribution: app-store
        LSUIElement: true
    sources:
      - path: Tools/SandboxProbe
      - path: Sources/DosMacApp/Resources/GuestTools
        buildPhase: resources
    dependencies:
      - package: DosMac
        product: DosMacVM
      - package: DosMac
        product: DosMacPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dosmac.probe
        PRODUCT_NAME: DosMacProbe
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Configuration/AppStore.entitlements
        INFOPLIST_KEY_DosMacDistribution: app-store
        INFOPLIST_KEY_LSUIElement: YES
